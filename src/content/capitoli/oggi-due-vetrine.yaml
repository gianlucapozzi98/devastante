testo: >-
  Un localino con due vetrine. Costi più leggeri, e lo spazio per riportare la teglia.
  Accanto al trancio, lo smash burger: ce lo chiedete tanto, soprattutto da portare via.
nota: Indirizzo e data di apertura da confermare. Cosa significa "che avremo di fronte"?
