titolo: Il passaggio
ordine: 3
ancora: cap-2016
etichetta: '2016'
occhiello: Capitolo 3 · 2016
testo: >-
  Nel 2016 TABISCA passa a noi. Il locale grande ha molti costi e il trancio, da solo,
  non basta. Così studiamo l'impasto della pizza tonda, che piace molto. E il trancio,
  per un po', si ferma.
nota: Confermare l'anno di chiusura del trancio.
