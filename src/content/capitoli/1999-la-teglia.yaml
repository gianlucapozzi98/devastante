titolo: La teglia
ordine: 1
ancora: cap-1999
etichetta: '1999'
occhiello: Capitolo 1 · Cesano Boscone, 1999
testo: >-
  Cesano Boscone, 1999. Da TABISCA si vende pizza in teglia, e a farla ci sono il nonno,
  la nonna e lo zio. Per anni ci mettono passione, mani e cuore.
nota: >-
  Date dal racconto del titolare: da confermare in forma definitiva. Nomi di nonni e zio
  solo con il consenso della famiglia. Foto d'epoca solo se le fornisce la famiglia.
